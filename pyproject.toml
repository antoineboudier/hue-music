[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huemusic"
version = "0.1.0"
description = "Hand-made Philips Hue light shows synced to Spotify playback"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "spotipy>=2.24",
    "python-mbedtls>=2.9",
    "PyYAML>=6.0",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
analysis = ["librosa>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
huemusic = "huemusic.cli:main"

[tool.setuptools]
packages = ["huemusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
