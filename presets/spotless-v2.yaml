# Spotless - Martin Garrix & Jay Hardway: variant of spotless.
# Track header, sections, palette and groups come from spotless.yaml
# (edit them there, or override single keys here). The cues below are this
# version's own: change them freely. Add `inherit_cues: true` to keep
# spotless's cues and only add new ones on top.

based_on: spotless
description: "my second take"

cues:
  # ------------------------------------------------------------- intro
  - in: pickup
    effect: fade
    from: black
    to: deep

  - in: intro
    effect: solid
    color: deep

  - in: intro                     # kick on every beat
    effect: pulse
    color: ice
    every: 1
    decay: 0.45
    intensity: 0.7
    blend: add

  - in: intro                     # accent on each bar, walking across the room
    effect: chase
    color: white
    every: 4
    width: 2
    decay: 0.8
    blend: add

  # ---------------------------------------------------- melodic break
  - in: break1
    effect: breathe
    color: blue
    period: 2 bars
    min: 0.15
    intensity: 0.6
    fade_in: 2 beats

  - at: bar 12 beat 1
    dur: 0.5s
    effect: solid
    color: white
    fade_out: 0.5s

  # The melody: 6 notes (beats 3, 3.5, 3.75, 4, 4.5, 1) then 1 note on beat 2,
  # repeating every bar. The 6 notes walk around the room, one light each...
  - at: bar 12 beat 3
    until: build1
    order: circle
    effect: sequence
    step: 0.25
    pattern: "> . > >  > . > .  > . . .  . . . ."
    color: ice
    decay: 1.5
    blend: add

  # ...and the single note lights the whole room
  - at: bar 12 beat 3
    until: build1
    effect: sequence
    step: 0.25
    pattern: ". . . .  . . . .  . . . .  A - - ."
    color: white
    decay: 1
    intensity: 0.8
    blend: add

  # ----------------------------------------------------------- build 1
  - in: build1                    # dim background, slowly rising
    effect: fade
    from: black
    to: deep
    ease: in

  - in: build1                    # light running around the room, speeding up:
    until: bar 35                 # (stops where the two-note figure starts)
    order: circle                 # 1 beat -> 1/2 -> 1/4 -> 1/8
    effect: chase
    colors: [ice, white]
    every: 1
    every_end: 0.125
    curve: doubling
    tail: 2
    blend: add

  # The two alternating notes just before the drop (1:04 -> 1:06):
  # left half / right half, on 8th notes. Draft from the audio analysis:
  # refine it with the studio's tap recording if the rhythm differs.
  - at: bar 35
    until: drop1
    effect: sequence
    step: 0.5
    pattern: "L R L R L R L R"
    colors: [ice, white]
    decay: 0.9
    background: deep

  # The big pre-drop sound (bar 35 beat 4): all lights jump to white and
  # fall quickly to black, so the first pulse of the drop hits from darkness.
  - at: drop1 - 1 beat
    until: drop1
    effect: fade
    from: white
    to: black
    ease: out

  # ------------------------------------------------------------ drop 1
  - in: drop1                     # pumping two-color pulse
    effect: pulse
    colors: [cyan, magenta]
    every: 1
    decay: 0.8
    min: 0.15

  - in: drop1                     # white chase on 8th notes
    effect: chase
    color: white
    every: 0.5
    direction: bounce
    decay: 0.6
    intensity: 0.7
    blend: add

  - at: drop1 + 8 bars            # second half: room halves swap colors
    until: drop1.end
    effect: alternate
    colors: [cyan, violet]
    every: 1
    blend: max

  - at: drop1 + 7 bars            # bar 43: strobe bouncing between the room
    dur: 1 bar                    # halves on 16ths, the whole room on beat 4
    effect: sequence
    step: 0.125                   # hard flashes: on for a 32nd, black for a 32nd
    pattern: "L . R . L . R .  L . R . L . R .  L . R . L . R .  A . A . A . A ."
    color: white
    decay: 0
    background: black

  - at: drop1.end - 1 bar         # last bar: fast strobe
    until: drop1.end
    effect: strobe
    rate: 4
    blend: add

  - at: drop1                     # THE hit
    dur: 2 beats
    effect: solid
    color: white
    fade_out: 2 beats

  # ----------------------------------------------- silence / breakdown
  - in: silence
    effect: fade
    from: ice
    to: black
    ease: out

  - in: breakdown
    effect: breathe
    color: violet
    period: 2 bars
    min: 0.15
    fade_in: 1 bar

  - in: breakdown
    effect: sweep
    color: cyan
    every: 1 bar
    width: 0.25
    intensity: 0.6
    blend: add

  - at: breakdown + 8 bars        # second half: sparkles join in
    until: breakdown.end
    effect: sparkle
    color: ice
    every: 1
    density: 0.3
    intensity: 0.6
    blend: add

  # ----------------------------------------------------------- build 2
  - in: build2
    effect: fade
    from: black
    to: violet
    ease: in

  - at: build2                    # same circle, other way round, longer tail
    until: build2.end - 2 bars
    order: circle
    effect: chase
    colors: [magenta, white]
    direction: backward
    every: 1
    every_end: 0.25
    curve: doubling
    tail: 3
    blend: add

  - at: build2.end - 2 bars       # bar 76: the chase carries on at top speed
    dur: 1 bar                    # (separate cue, so the speed-ups above stay
    order: circle                 # on the bar lines)
    effect: chase
    colors: [magenta, white]
    direction: backward
    every: 0.25
    tail: 3
    blend: add

  - at: build2.end - 2 bars       # full-room strobe joins the chase in bar 76
    until: bar 77
    effect: strobe
    color: white
    rate: 2
    rate_end: 5.43
    duty: 0.3
    blend: add

  # Bar 77, beats 1-3: the two-note figure (on the beat and the next 16th,
  # then silence). One flash per note, left then right, dark in between.
  - at: bar 77
    until: bar 77 beat 4
    effect: sequence
    step: 0.25
    pattern: "L R . ."
    colors: [magenta, white]
    decay: 0
    background: black

  - at: drop2 - 1 beat            # same pre-drop fade as build 1, on beat 4
    until: drop2
    effect: fade
    from: white
    to: black
    ease: out

  # ------------------------------------------------------------ drop 2
  - at: drop2                     # full color wheel spinning around the room
    until: drop2 + 8 bars
    order: circle
    effect: rainbow
    speed: 2 bars
    spread: 1

  - at: drop2                     # beat pulse on top of the rainbow
    until: drop2 + 8 bars
    effect: pulse
    color: white
    every: 1
    decay: 0.35
    intensity: 0.8
    blend: add

  - at: drop2 + 7 bars            # bar 85: same strobe as bar 43, halves
    dur: 1 bar                    # bouncing, the whole room on beat 4
    effect: sequence
    step: 0.125
    pattern: "L . R . L . R .  L . R . L . R .  L . R . L . R .  A . A . A . A ."
    color: white
    decay: 0
    background: black

  - at: drop2 + 8 bars            # second half: magenta / cyan halves
    until: drop2.end
    effect: alternate
    colors: [magenta, cyan]
    every: 1

  - at: drop2 + 8 bars
    until: drop2.end
    effect: sparkle
    color: white
    every: 0.25
    density: 0.25
    blend: add

  - at: drop2.end - 2 bars        # build into the outro
    until: drop2.end
    effect: strobe
    rate: 2
    rate_end: 8
    blend: add

  - at: drop2
    dur: 2 beats
    effect: solid
    color: white
    fade_out: 2 beats

  # ------------------------------------------------------------- outro
  - in: outro
    effect: pulse
    colors: [cyan, blue]
    every: 1
    decay: 0.6
    min: 0.1

  - in: outro
    effect: chase
    color: white
    every: 2
    decay: 0.9
    blend: add
    intensity: 0.6

  - in: fadeout
    effect: fade
    from: deep
    to: black
